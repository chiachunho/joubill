name: PR Check

on:
  pull_request:
    branches: [main, dev]

env:
  DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
  TELEGRAM_BOT_TOKEN: dummy
  TELEGRAM_WEBHOOK_SECRET: dummy
  TELEGRAM_MINI_APP_NAME: dummy
  TELEGRAM_STORAGE_CHAT_ID: "0"
  NEXT_PUBLIC_MINI_APP_URL: http://localhost:3000/mini
  AUTH_SECRET: dummy-secret-for-ci-build-only

# Every job only reads the repository; page-pairs widens its own token to post a comment.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Advisory only (issue #57): warns when a change edits one copy of a Mini App / Web App
  # page pair and not the other. It never fails the check, because some one-sided edits
  # are intentional.
  page-pairs:
    name: Page pairs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Posts the comment. A fork pull request gets a read-only token, so the comment step
      # warns there instead of failing.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The diff needs the base commit, which a shallow checkout does not have.
          fetch-depth: 0
          # This job runs the pull request's own script, so keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: node scripts/check-page-pairs.mjs ${{ github.event.pull_request.base.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
