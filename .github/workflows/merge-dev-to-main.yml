name: Merge dev → main & tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump level"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

jobs:
  merge-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version on dev
        id: version
        run: |
          git checkout -B dev origin/dev
          # npm version edits package.json and echoes the new version as v<semver>,
          # which is exactly our tag name. --no-git-tag-version leaves git to us.
          TAG=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          git add package.json
          git commit -m "chore: release ${TAG}"
          git push origin dev

      - name: Fast-forward merge dev into main
        run: |
          git checkout -B main origin/main
          git merge --ff-only dev
          git push origin main

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Summary
        run: echo "### Released \`${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
