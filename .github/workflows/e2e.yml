name: E2E (preview)

# Runs after Vercel reports a successful Preview deployment for a commit.
# GitHub only fires deployment_status from the default branch's workflow file,
# so this takes effect once it is merged into dev.
on:
  deployment_status:

jobs:
  e2e:
    name: Playwright (/app)
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E against the preview
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          CI: true
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
